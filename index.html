<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Log</title>
    <style>
        :root { --bg: #ffffff; --text: #222222; --accent: #444; --today: #f6f0f8; }
        body { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 1.2rem; text-align: left; border-bottom: 2px solid #eee; padding-bottom: 5px; margin: 10px 0 20px 0; }
        
        .entry { 
            display: grid; 
            grid-template-columns: 80px 1fr; 
            gap: 5px 15px;
            padding: 8px 5px;
            border-bottom: 1px solid #f0f0f0;
            align-items: baseline;
        }

        /* Resaltado de hoy: más discreto pero claro */
        .entry.today {
            background: var(--today);
            border-left: 3px solid #53006a;
            border-bottom-color: #d1d9e0;
        }

        .date { font-family: monospace; font-size: 0.85rem; color: #666; }
        .card { font-weight: 700; color: #000; }
        .note { 
            grid-column: 2; 
            margin: 0; 
            font-size: 0.9rem; 
            color: #555; 
            line-height: 1.3;
        }

        @media (max-width: 400px) {
            .entry { grid-template-columns: 75px 1fr; }
            .special-grid,
            .stats-grid { grid-template-columns: 1fr; }
        }

        /* Sección Especial (Año y Semana) */
        .special-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stats-panel { margin-bottom: 20px; }
        .stats-panel summary {
            cursor: pointer;
            font-weight: 700;
            padding: 10px 10px 8px;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fff9db;
            color: #222;
            list-style: none;
        }
        .stats-panel[open] summary {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }
        .stats-panel::-webkit-details-marker { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; border: 1px solid #eee; border-top: none; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; padding: 10px; background: #fff9db; }
        .chart-container { grid-column: 1 / -1; margin: 20px 0 10px; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 4px; }
        .chart-title { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; color: #666; display: block; margin-bottom: 10px; }
        .chart-bar { display: flex; align-items: center; margin-bottom: 5px; }
        .chart-label { width: 100px; font-size: 0.8rem; color: #555; }
        .chart-bar-fill { height: 12px; background: #53006a; border-radius: 2px; transition: width 0.3s; }
        .chart-percent { margin-left: 10px; font-size: 0.8rem; font-weight: 700; color: #333; }
        .special-card,
        .stats-card { background: transparent; padding: 0; border: none; border-radius: 0; }
        .label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; color: #888; display: block; }
        .special-name { font-weight: bold; font-size: 0.9rem; display: block; margin: 2px 0; }
        .stats-value { display: block; font-weight: 700; font-size: 0.95rem; margin-top: 4px; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Diario Tarot</h1>
        <div class="container">
            <div class="special-grid" id="destacados"></div>
            <details class="stats-panel">
                <summary>Estadísticas</summary>
                <div class="stats-grid" id="estadisticas"></div>
            </details>
            <div id="lista"></div>
        </div>
    </div>

    <script src="cartas.js"></script>
    <script>
        const container = document.getElementById('lista');

        // Renderizar Especiales (AÑADIR ESTO)
        const destacados = document.getElementById('destacados');
        destacados.innerHTML = `
            <div class="special-card"><span class="label">Año 2026</span><span class="special-name">${especiales.año.carta}</span><span class="note">${especiales.año.nota}</span></div>
            <div class="special-card"><span class="label">Semana Actual</span><span class="special-name">${especiales.semana.carta}</span><span class="note">${especiales.semana.nota}</span></div>
        `;

        const estadisticas = document.getElementById('estadisticas');
        const fechas = registros
            .map(r => r.fecha.split('.').reverse().join('-'))
            .sort();
        const contadorCartas = registros.reduce((acc, item) => {
            acc[item.carta] = (acc[item.carta] || 0) + 1;
            return acc;
        }, {});
        const cartasDistintas = Object.keys(contadorCartas).length;
        const maxRepeticiones = registros.length ? Math.max(...Object.values(contadorCartas)) : 0;
        const cartasFrecuentes = registros.length
            ? Object.entries(contadorCartas)
                .filter(([, count]) => count === maxRepeticiones)
                .map(([carta]) => carta)
            : ['N/A'];

        const getSuit = carta => {
            const lower = carta.toLowerCase();
            if (lower.includes('espadas')) return 'Espadas';
            if (lower.includes('bastos')) return 'Bastos';
            if (lower.includes('copas')) return 'Copas';
            if (lower.includes('pentáculos') || lower.includes('pentaculos')) return 'Pentáculos';
            return 'Arcanos mayores';
        };

        const renderSuitChart = (suitCounts) => {
            const total = Object.values(suitCounts).reduce((sum, count) => sum + count, 0);
            if (total === 0) return '<div class="chart-container">No hay datos para este mes.</div>';

            const suits = ['Espadas', 'Bastos', 'Copas', 'Pentáculos', 'Arcanos mayores'];
            let chartHTML = '<div class="chart-container"><div class="chart-title">Distribución de palos este mes</div>';
            suits.forEach(suit => {
                const count = suitCounts[suit] || 0;
                const percent = total > 0 ? Math.round((count / total) * 100) : 0;
                const barWidth = percent === 0 ? '1px' : `${percent}%`;
                const barColor = percent === 0 ? '#ccc' : '#53006a';
                chartHTML += `
                    <div class="chart-bar">
                        <span class="chart-label">${suit}</span>
                        <div class="chart-bar-fill" style="width: ${barWidth}; background: ${barColor}"></div>
                        <span class="chart-percent">${percent}%</span>
                    </div>
                `;
            });
            chartHTML += '</div>';
            return chartHTML;
        };

        const suitCount = registros.reduce((acc, item) => {
            const suit = getSuit(item.carta);
            acc[suit] = (acc[suit] || 0) + 1;
            return acc;
        }, {});

        const currentDate = new Date();
        const currentYear = currentDate.getFullYear();
        const currentMonth = currentDate.getMonth() + 1;
        const registrosMesActual = registros.filter(item => {
            const [day, month, year] = item.fecha.split('.').map(Number);
            return year === currentYear && month === currentMonth;
        });

        const suitCountMonth = registrosMesActual.reduce((acc, item) => {
            const suit = getSuit(item.carta);
            acc[suit] = (acc[suit] || 0) + 1;
            return acc;
        }, {});

        const getMostRepeated = counts => {
            const entries = Object.entries(counts);
            if (!entries.length) return 'N/A';
            const maxCount = Math.max(...entries.map(([, count]) => count));
            return entries
                .filter(([, count]) => count === maxCount)
                .map(([suit]) => suit)
                .join(', ') + ` (${maxCount})`;
        };

        const frequentSuit = getMostRepeated(suitCount);

        estadisticas.innerHTML = `
            <div class="stats-card"><span class="label">Entradas</span><span class="stats-value">${registros.length}</span></div>
            <div class="stats-card"><span class="label">Cartas distintas</span><span class="stats-value">${cartasDistintas}</span></div>
            <div class="stats-card"><span class="label">Carta más repetida</span><span class="stats-value">${cartasFrecuentes.join(', ')} (${maxRepeticiones})</span></div>
            <div class="stats-card"><span class="label">Palo más repetido</span><span class="stats-value">${frequentSuit}</span></div>
            ${renderSuitChart(suitCountMonth)}
        `;

        const today = new Date();
        const todayString = String(today.getDate()).padStart(2, '0') + '.' + String(today.getMonth() + 1).padStart(2, '0') + '.' + today.getFullYear();

        registros.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'entry';
            if (item.fecha === todayString) {
                div.classList.add('today');
            }
            div.innerHTML = `
                <span class="date">${item.fecha}</span>
                <span class="card">${item.carta}</span>
                <p class="note">${item.nota}</p>
            `;
            container.appendChild(div);
        });
    </script>
</body>
</html>
