<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Tarot: carta diaria</title>
    <style>
        :root { --bg: #fdfdfd; --text: #333; --accent: #6200ee; --today-bg: #f3f0ff; }
        body { font-family: sans-serif; line-height: 1.6; color: var(--text); background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        h1 { text-align: center; font-weight: 300; }
        .log-entry { padding: 20px; border-bottom: 1px solid #eaeaea; }
        .log-entry:first-child { background: var(--today-bg); border: 1px solid var(--accent); border-radius: 8px; margin-bottom: 20px; }
        .date { font-size: 0.8rem; color: #666; display: block; }
        .card-name { font-weight: bold; font-size: 1.1rem; }
        .badge { background: var(--accent); color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; margin-bottom: 5px; display: inline-block; }
        .note { margin-top: 8px; font-style: italic; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mi carta diaria</h1>
        <div id="lista"></div>
    </div>

    <script src="cartas.js"></script>
    <script>
        const contenedor = document.getElementById('lista');
        registros.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `
                ${index === 0 ? '<span class="badge">Hoy</span>' : ''}
                <span class="date">${item.fecha}</span>
                <span class="card-name">${item.carta}</span>
                <p class="note">${item.nota}</p>
            `;
            contenedor.appendChild(div);
        });
    </script>
</body>
</html>
