<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Mazos de Tarot</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --bg: #0f111a;
            --surface: #1e2235;
            --surface-hover: #282e48;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #d4af37; /* Oro */
            --font: system-ui, -apple-system, sans-serif;
            
            /* Colores de palos que ya usas */
            --arcanos: #a855f7;
            --bastos: #a34e36;
            --pentaculos: #d4af37;
            --espadas: #5f7d95;
            --copas: #3a9fb7;
        }

        body {
            margin: 0;
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        #app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            background-color: rgba(15, 17, 26, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent);
        }

        .selector-mazo {
            background: var(--surface);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        main {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: -webkit-fill-available;
        }

        .deck-info {
            margin-bottom: 30px;
            border-left: 3px solid var(--accent);
            padding-left: 15px;
        }

        .deck-info p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 0.95rem;
        }

        .grid-cartas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card-item {
            background: var(--surface);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid rgba(255,255,255,0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-item:hover {
            transform: translateY(-2px);
            background-color: var(--surface-hover);
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            align-self: flex-start;
        }

        /* Colores dinámicos para los badges */
        .badge-arcanos { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }
        .badge-bastos { background: rgba(163, 78, 54, 0.2); color: #e07a5f; border: 1px solid #a34e36; }
        .badge-pentaculos { background: rgba(212, 175, 55, 0.2); color: #f4d35e; border: 1px solid #d4af37; }
        .badge-espadas { background: rgba(95, 125, 149, 0.2); color: #94b1ca; border: 1px solid #5f7d95; }
        .badge-copas { background: rgba(58, 159, 183, 0.2); color: #67e8f9; border: 1px solid #3a9fb7; }

        .nota-preview {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Estilos del visor detalle (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 11, 16, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-nota {
            font-size: 1rem;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap; /* Mantiene saltos de línea */
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 10px; align-items: flex-start; }
            .selector-mazo { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <h1>🔮 Compendio de Tarot</h1>
            <select class="selector-mazo" v-model="idMazoSeleccionado">
                <option v-for="mazo in indiceMazos" :key="mazo.id" :value="mazo.id">
                    {{ mazo.nombre }}
                </option>
            </select>
        </header>


        

        <main v-if="mazoActual">
            <a href="/tarotdailycard" class="link-block">Atrás</a>
            <div class="deck-info">
                <h2>{{ mazoActual.nombre }}</h2>
                <p>{{ mazoActual.descripcion }}</p>
            </div>

            <div class="grid-cartas">
                <div class="card-item" 
                     v-for="carta in mazoActual.cartas" 
                     :key="carta.id"
                     @click="abrirCarta(carta)">
                    <div>
                        <div class="card-title">{{ carta.nombre }}</div>
                        <span :class="['badge', obtenerClaseBadge(carta.tipo)]">
                            {{ carta.tipo }}
                        </span>
                    </div>
                    <div class="nota-preview">
                        {{ carta.nota_personal || 'Sin notas aún...' }}
                    </div>
                </div>
            </div>
        </main>

        <div class="modal-overlay" v-if="cartaActiva" @click.self="cerrarCarta">
            <div class="modal-content">
                <button class="close-btn" @click="cerrarCarta">&times;</button>
                <span :class="['badge', obtenerClaseBadge(cartaActiva.tipo)]">
                    {{ cartaActiva.tipo }}
                </span>
                <h2 style="margin: 10px 0 5px 0; color: var(--accent);">{{ cartaActiva.nombre }}</h2>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0 0 20px 0;">Notas de: {{ mazoActual.nombre }}</p>
                
                <div class="modal-nota" v-html="procesarAnotaciones(cartaActiva.nota_personal || 'No has escrito ninguna interpretación todavía.')"></div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, watch, onMounted } = Vue;
    
        createApp({
            setup() {
                const indiceMazos = ref([]);        // Lista de mazos disponibles (el índice)
                const idMazoSeleccionado = ref(''); // ID del mazo activo en el select
                const mazoActual = ref(null);       // Datos completos del mazo cargado dinámicamente
                const cartaActiva = ref(null);      // Carta seleccionada en el modal

                const glosario = [
                    { palabra: "león", definicion: "fuego, impulsos, fuerza" },
                    { palabra: "rojo", definicion: "pasión, acción, vitalidad" },
                    { palabra: "agua", definicion: "emociones, subconsciente, intuición" }
                ];
                
                const procesarAnotaciones = (texto) => {
                    if (!texto) return '';
                    let textoProcesado = texto;
                    
                    glosario.forEach(item => {
                        // Busca la palabra ignorando mayúsculas/minúsculas (gi), 
                        // asegurándose de que esté rodeada por espacios, puntuación o el inicio/fin del texto.
                        const regex = new RegExp(`(?<=^|\\s|[.,;:!¡¿?\\n])(${item.palabra})(?=\\s|[.,;:!¡¿?\\n]|$)`, 'gi');
                        
                        // Reemplaza envolviendo la coincidencia ($1 mantiene si estaba en mayúscula o minúscula)
                        textoProcesado = textoProcesado.replace(regex, `<span class="palabra-clave" data-tooltip="${item.definicion}">$1</span>`);
                    });
                    
                    return textoProcesado;
                };
                
                // 1. Al cargar la web, traemos solo el índice general
                onMounted(async () => {
                    try {
                        const res = await fetch('mazos.json');
                        indiceMazos.value = await res.json();
                        
                        if (indiceMazos.value.length > 0) {
                            idMazoSeleccionado.value = indiceMazos.value[0].id;
                        }
                    } catch (e) {
                        console.error("Error cargando el índice de mazos.", e);
                        // Fallback de desarrollo por si abres el archivo localmente
                        indiceMazos.value = [{ id: "ejemplo", nombre: "Mazo de Muestra", archivo: "" }];
                        mazoActual.value = {
                            nombre: "Mazo de Muestra",
                            descripcion: "Crea tu índice 'mazos.json' y tus archivos individuales.",
                            cartas: [{ id: "0", nombre: "El Loco", tipo: "Arcano Mayor", nota_personal: "Crea los JSON independientes." }]
                        };
                    }
                });
    
                // 2. Vigilamos el selector. Cuando cambia el ID, cargamos su JSON específico.
                watch(idMazoSeleccionado, async (nuevoId) => {
                    if (!nuevoId || nuevoId === 'ejemplo') return;
                    
                    // Buscamos cuál es el archivo correspondiente en el índice
                    const mazoInfo = indiceMazos.value.find(m => m.id === nuevoId);
                    
                    if (mazoInfo && mazoInfo.archivo) {
                        try {
                            const res = await fetch(mazoInfo.archivo);
                            mazoActual.value = await res.json();
                        } catch (e) {
                            console.error(`Error cargando el mazo: ${mazoInfo.archivo}`, e);
                        }
                    }
                });
    
                const abrirCarta = (carta) => { cartaActiva.value = carta; };
                const cerrarCarta = () => { cartaActiva.value = null; };
    
                const obtenerClaseBadge = (tipo) => {
                    if (!tipo) return '';
                    const t = tipo.toLowerCase();
                    if (t.includes('mayor')) return 'badge-arcanos';
                    if (t.includes('basto')) return 'badge-bastos';
                    if (t.includes('pentáculo') || t.includes('oro')) return 'badge-pentaculos';
                    if (t.includes('espada')) return 'badge-espadas';
                    if (t.includes('copa')) return 'badge-copas';
                    return '';
                };
    
                return {
                    indiceMazos,
                    idMazoSeleccionado,
                    mazoActual,
                    cartaActiva,
                    abrirCarta,
                    cerrarCarta,
                    obtenerClaseBadge
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
