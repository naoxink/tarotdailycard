<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Mazos de Tarot</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div class="container">
        <div id="app">
        <header>
            <h1>🔮 Compendio de Tarot</h1>
            <select class="selector-mazo" v-model="idMazoSeleccionado">
                <option v-for="mazo in indiceMazos" :key="mazo.id" :value="mazo.id">
                    {{ mazo.nombre }}
                </option>
            </select>
        </header>


        

        <main v-if="mazoActual">
            <a href="index.html" class="link-block">Atrás</a>
            <div class="deck-info">
                <h2>{{ mazoActual.nombre }}</h2>
                <p>{{ mazoActual.descripcion }}</p>
            </div>

            <div class="grid-cartas">
                <div class="card-item" 
                     v-for="carta in mazoActual.cartas" 
                     :key="carta.id"
                     @click="abrirCarta(carta)">
                    <div>
                        <div class="card-title">{{ carta.nombre }}</div>
                        <span :class="['badge', obtenerClaseBadge(carta.tipo)]">
                            {{ carta.tipo }}
                        </span>
                    </div>
                    <div class="nota-preview">
                        {{ carta.nota_personal || 'Sin notas aún...' }}
                    </div>
                </div>
            </div>
        </main>

    <div class="modal-overlay" v-if="cartaActiva" @click.self="cerrarCarta">
        <div class="modal-content">
            <button class="close-btn" @click="cerrarCarta">&times;</button>
            <span :class="['badge', obtenerClaseBadge(cartaActiva.tipo)]">
                {{ cartaActiva.tipo }}
            </span>
            <h2>{{ cartaActiva.nombre }}</h2>
            <p class="modal-meta">Notas de: {{ mazoActual.nombre }}</p>
            
            <div class="modal-nota" v-html="procesarNotaFinal(cartaActiva.nota_personal || 'No has escrito ninguna interpretación todavía.')"></div>
        </div>
    </div>


    </div>
    <script>
const { createApp, ref, watch, onMounted, onBeforeUnmount } = Vue;
    
        createApp({
            setup() {
                const indiceMazos = ref([]);        // Lista de mazos disponibles (el índice)
                const idMazoSeleccionado = ref(''); // ID del mazo activo en el select
                const mazoActual = ref(null);       // Datos completos del mazo cargado dinámicamente
                const cartaActiva = ref(null);      // Carta seleccionada en el modal

                const bloquearScroll = (activar) => {
                    const root = document.documentElement;
                    const body = document.body;

                    if (activar) {
                        root.style.overflow = 'hidden';
                        root.style.height = '100%';
                        body.style.overflow = 'hidden';
                        body.style.height = '100%';
                        body.classList.add('modal-open');
                    } else {
                        root.style.overflow = '';
                        root.style.height = '';
                        body.style.overflow = '';
                        body.style.height = '';
                        body.classList.remove('modal-open');
                    }
                };

                const glosario = [
                    // --- Elementos Básicos y Palos ---
                    { palabra: "agua", definicion: "Emociones, intuición, el reino del subconsciente (Copas)" },
                    { palabra: "fuego", definicion: "Voluntad, acción, pasiones, chispa vital (Bastos)" },
                    { palabra: "tierra", definicion: "Mundo material, cuerpo físico, recursos, estabilidad (Oros)" },
                    { palabra: "aire", definicion: "Intelecto, mente, comunicación, conflicto (Espadas)" },
                    
                    // --- Colores ---
                    { palabra: "blanco", definicion: "Pureza, inocencia, limpieza espiritual, la luz antes de refractarse" },
                    { palabra: "negro", definicion: "Misterio, el vacío fértil, el final de un ciclo, lo oculto" },
                    { palabra: "amarillo", definicion: "Consciencia, luz solar, intelecto activo, divinidad" },
                    { palabra: "rojo", definicion: "Pasión, acción, sangre, vitalidad, el mundo terrenal" },
                    { palabra: "azul", definicion: "Subconsciente, fluidez, espiritualidad, reflexión" },
                    { palabra: "gris", definicion: "Sabiduría, neutralidad, tristeza o apatía" },
                
                    // --- Animales ---
                    { palabra: "león", definicion: "Fuego, impulsos, fuerza vital salvaje, coraje" },
                    { palabra: "perro", definicion: "Instinto domesticado, lealtad, la mente consciente protectora" },
                    { palabra: "lobo", definicion: "Instinto salvaje, miedos primitivos, lo indómito" },
                    { palabra: "caballo", definicion: "Vehículo de la voluntad, energía de avance, instinto dirigido" },
                    { palabra: "pájaro", definicion: "Pensamientos, mensajes del espíritu, libertad mental" },
                
                    // --- Símbolos y Naturaleza ---
                    { palabra: "infinito", definicion: "Lemniscata: equilibrio perfecto, dominio espiritual sobre la materia" },
                    { palabra: "corona", definicion: "Autoridad, dominio mental, conexión con la mente superior (Kether)" },
                    { palabra: "montaña", definicion: "Desafíos, conocimiento abstracto, la morada de la divinidad" },
                    { palabra: "nube", definicion: "Intervención divina, pensamientos que ocultan la verdad, lo efímero" },
                    { palabra: "torre", definicion: "Estructuras falsas del ego, revelación brusca, liberación forzada" },
                    { palabra: "sol", definicion: "Claridad absoluta, éxito, energía masculina, consciencia" },
                    { palabra: "luna", definicion: "Misterio, miedos, ciclos, energía femenina, ilusión" },
                    { palabra: "estrella", definicion: "Esperanza, guía cósmica, inspiración, sanación tras la tormenta" },
                    { palabra: "río", definicion: "El flujo de la vida, transición, el cauce del subconsciente" },
                    { palabra: "castillo", definicion: "Civilización, metas alcanzadas, a veces aislamiento o defensas" },

                    { palabra: "3", definicion: "Creación y manifestación" },

                    { palabra: "mercurio", definicion: "Comunicación, intelecto, movilidad, cambio, agilidad mental" }
                ];

                const formatearMarkdownLigero = (texto) => {
                    if (!texto) return '';
                    
                    // 1. Reemplazamos **texto** por <strong>
                    let procesado = texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    
                    // 2. Reemplazamos *texto* por <em>
                    procesado = procesado.replace(/\*(.*?)\*/g, '<em>$1</em>');
                    
                    // 3. Convertimos los saltos de línea reales (\n) en <br> para que no se peguen los párrafos
                    procesado = procesado.replace(/\n/g, '<br>');
                    
                    return procesado;
                };

                const procesarAnotaciones = (texto) => {
                    if (!texto) return '';
                    let textoProcesado = texto;
                    
                    // Función para que la regex no distinga entre vocales con o sin tilde (león = leon)
                    const flexibilizarAcentos = (palabra) => {
                        return palabra
                            .replace(/[aá]/gi, '[aá]')
                            .replace(/[eé]/gi, '[eé]')
                            .replace(/[ií]/gi, '[ií]')
                            .replace(/[oó]/gi, '[oó]')
                            .replace(/[uúü]/gi, '[uúü]');
                    };
                    
                    glosario.forEach(item => {
                        // 1. Flexibilizamos la palabra base (ej: l[eé][oó]n)
                        const baseRegex = flexibilizarAcentos(item.palabra);
                        
                        // 2. Construimos la expresión regular.
                        // - (?:s|es)? hace que la "s" o "es" final sea opcional.
                        // - La bandera 'i' final es la que la hace Case Insensitive (ignorando mayúsculas/minúsculas).
                        // - La bandera 'g' hace que busque todas las coincidencias en el texto, no solo la primera.
                        const regexStr = `(?<=^|\\s|[.,;:!¡¿?\\n])(${baseRegex}(?:s|es)?)(?=\\s|[.,;:!¡¿?\\n]|$)`;
                        const regex = new RegExp(regexStr, 'gi');
                        
                        // 3. Reemplazamos conservando la palabra original que escribiste ($1)
                        textoProcesado = textoProcesado.replace(regex, `<span class="palabra-clave" data-tooltip="${item.definicion}">$1</span>`);
                    });
                    
                    return textoProcesado;
                };

                const procesarNotaFinal = (texto) => {
                    if (!texto) return 'No has escrito ninguna interpretación para esta carta todavía.';
                    
                    // 1. Primero inyectamos los tooltips de las palabras clave
                    let paso1 = procesarAnotaciones(texto);
                    
                    // 2. Después aplicamos los saltos de línea y el formato markdown ligero
                    let paso2 = formatearMarkdownLigero(paso1)
                        
                    return paso2;
                };
                
                // 1. Al cargar la web, traemos solo el índice general
                onMounted(async () => {
                    try {
                        const res = await fetch('mazos.json');
                        indiceMazos.value = await res.json();
                        
                        if (indiceMazos.value.length > 0) {
                            idMazoSeleccionado.value = indiceMazos.value[0].id;
                        }
                    } catch (e) {
                        console.error("Error cargando el índice de mazos.", e);
                        // Fallback de desarrollo por si abres el archivo localmente
                        indiceMazos.value = [{ id: "ejemplo", nombre: "Mazo de Muestra", archivo: "" }];
                        mazoActual.value = {
                            nombre: "Mazo de Muestra",
                            descripcion: "Crea tu índice 'mazos.json' y tus archivos individuales.",
                            cartas: [{ id: "0", nombre: "El Loco", tipo: "Arcano Mayor", nota_personal: "Crea los JSON independientes." }]
                        };
                    }
                });
    
                // 2. Vigilamos el selector. Cuando cambia el ID, cargamos su JSON específico.
                watch(idMazoSeleccionado, async (nuevoId) => {
                    if (!nuevoId || nuevoId === 'ejemplo') return;
                    
                    // Buscamos cuál es el archivo correspondiente en el índice
                    const mazoInfo = indiceMazos.value.find(m => m.id === nuevoId);
                    
                    if (mazoInfo && mazoInfo.archivo) {
                        try {
                            const res = await fetch(mazoInfo.archivo);
                            mazoActual.value = await res.json();
                        } catch (e) {
                            console.error(`Error cargando el mazo: ${mazoInfo.archivo}`, e);
                        }
                    }
                });
    
                const abrirCarta = (carta) => { cartaActiva.value = carta; };
                const cerrarCarta = () => { cartaActiva.value = null; };

                watch(cartaActiva, (valor) => {
                    bloquearScroll(Boolean(valor));
                }, { flush: 'sync' });

                onMounted(() => {
                    bloquearScroll(Boolean(cartaActiva.value));
                });
    
                const obtenerClaseBadge = (tipo) => {
                    if (!tipo) return '';
                    const t = tipo.toLowerCase();
                    if (t.includes('mayor')) return 'badge-arcanos';
                    if (t.includes('basto')) return 'badge-bastos';
                    if (t.includes('pentáculo') || t.includes('oro')) return 'badge-pentaculos';
                    if (t.includes('espada')) return 'badge-espadas';
                    if (t.includes('copa')) return 'badge-copas';
                    return '';
                };
    
                return {
                    indiceMazos,
                    idMazoSeleccionado,
                    mazoActual,
                    cartaActiva,
                    abrirCarta,
                    cerrarCarta,
                    obtenerClaseBadge,
                    procesarAnotaciones,
                    procesarNotaFinal
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
