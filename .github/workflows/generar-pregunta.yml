name: Generar pregunta de práctica

on:
  schedule:
    # Se ejecuta a diario a las 08:00 UTC; el script decide internamente
    # si ya toca generar pregunta nueva (cada 3 días).
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar-pregunta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar pregunta y actualizar tiradas.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generar-pregunta.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "tarot-bot"
          git config user.email "tarot-bot@users.noreply.github.com"
          git add tiradas.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "🔮 Añadir pregunta de práctica automática"
            git push
          fi