<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Tiradas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div class="container">
        <div id="app">
        <header>
            <h1>🔮 Registro de Tiradas</h1>
        </header>

        <a href="index.html" class="link-block">Atrás</a>

        <main class="feed-tiradas">
            <!-- Iteramos sobre las tiradas ordenadas por fecha -->
            <div class="tirada-card" v-for="tirada in tiradasOrdenadas" :key="tirada.interpretacion">
                
                <div class="tirada-header">
                    <span class="fecha">{{ formatearFecha(tirada.fecha) }}</span>
                    <span class="anonimo-tag">Consultante: {{ tirada.consultante || 'Anónimo' }}</span>
                </div>

                <h2 class="pregunta">"{{ tirada.pregunta }}"</h2>

                <div class="cartas-layout">
                    <div class="carta-item" v-for="(carta, index) in tirada.cartas" :key="index">
                        <div class="carta-posicion">{{ carta.posicion }}</div>
                        <div class="carta-nombre">{{ carta.nombre }}</div>
                        <span :class="['badge', obtenerClaseBadge(carta.palo)]">
                            {{ carta.palo }}
                        </span>
                    </div>
                </div>

                <div class="interpretacion">
                    {{ tirada.interpretacion }}
                </div>
            </div>

            <div v-if="tiradasOrdenadas.length === 0" class="fallback-message">
                Aún no hay tiradas registradas. Crea tu archivo tiradas.json.
            </div>
        </main>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const tiradas = ref([]);

                onMounted(async () => {
                    try {
                        const res = await fetch('tiradas.json');
                        tiradas.value = await res.json();
                        console.log(tiradas.value)
                    } catch (e) {
                        console.error("Error cargando tiradas.json", e);
                    }
                });

                // Ordenamos para que la más reciente salga siempre primero arriba
                const tiradasOrdenadas = computed(() => {
                    return [...tiradas.value].sort((a, b) => {
                        return new Date(b.fecha) - new Date(a.fecha);
                    });
                });

                const formatearFecha = (fechaString) => {
                    const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
                    return new Date(fechaString).toLocaleDateString('es-ES', opciones);
                };

                const obtenerClaseBadge = (palo) => {
                    if (!palo) return '';
                    const p = palo.toLowerCase();
                    if (p.includes('mayor')) return 'badge-arcanos';
                    if (p.includes('basto')) return 'badge-bastos';
                    if (p.includes('oro') || p.includes('pentáculo')) return 'badge-oros';
                    if (p.includes('espada')) return 'badge-espadas';
                    if (p.includes('copa')) return 'badge-copas';
                    return '';
                };

                return {
                    tiradasOrdenadas,
                    formatearFecha,
                    obtenerClaseBadge
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
