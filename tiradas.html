<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Tiradas</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --bg: #0f111a;
            --surface: #1e2235;
            --surface-hover: #282e48;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #d4af37; 
            --font: system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        #app {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Estructura de línea de tiempo / Feed */
        .feed-tiradas {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .tirada-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tirada-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .fecha {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .anonimo-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .pregunta {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0 0 20px 0;
        }

        /* Grid de cartas dentro de la tirada */
        .cartas-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .carta-item {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }

        .carta-posicion {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .carta-nombre {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .interpretacion {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 8px;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        /* Badges reutilizados */
        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .badge-arcanos { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }
        .badge-bastos { background: rgba(163, 78, 54, 0.2); color: #e07a5f; border: 1px solid #a34e36; }
        .badge-oros { background: rgba(212, 175, 55, 0.2); color: #f4d35e; border: 1px solid #d4af37; }
        .badge-espadas { background: rgba(95, 125, 149, 0.2); color: #94b1ca; border: 1px solid #5f7d95; }
        .badge-copas { background: rgba(58, 159, 183, 0.2); color: #67e8f9; border: 1px solid #3a9fb7; }
        .link-block {
            color: var(--accent);
            text-align: center;
            padding: 5px 0;
            display: block;
        }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <h1>🔮 Registro de Tiradas</h1>
        </header>

        <a href="/tarotdailycard" class="link-block">Atrás</a>

        <main class="feed-tiradas">
            <!-- Iteramos sobre las tiradas ordenadas por fecha -->
            <div class="tirada-card" v-for="tirada in tiradasOrdenadas" :key="tirada.interpretacion">
                
                <div class="tirada-header">
                    <span class="fecha">{{ formatearFecha(tirada.fecha) }}</span>
                    <span class="anonimo-tag">Consultante: {{ tirada.consultante || 'Anónimo' }}</span>
                </div>

                <h2 class="pregunta">"{{ tirada.pregunta }}"</h2>

                <div class="cartas-layout">
                    <div class="carta-item" v-for="(carta, index) in tirada.cartas" :key="index">
                        <div class="carta-posicion">{{ carta.posicion }}</div>
                        <div class="carta-nombre">{{ carta.nombre }}</div>
                        <span :class="['badge', obtenerClaseBadge(carta.palo)]">
                            {{ carta.palo }}
                        </span>
                    </div>
                </div>

                <div class="interpretacion">
                    {{ tirada.interpretacion }}
                </div>
            </div>

            <div v-if="tiradasOrdenadas.length === 0" style="text-align:center; color: var(--text-muted);">
                Aún no hay tiradas registradas. Crea tu archivo tiradas.json.
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const tiradas = ref([]);

                onMounted(async () => {
                    try {
                        const res = await fetch('tiradas.json');
                        tiradas.value = await res.json();
                        console.log(tiradas.value)
                    } catch (e) {
                        console.error("Error cargando tiradas.json", e);
                    }
                });

                // Ordenamos para que la más reciente salga siempre primero arriba
                const tiradasOrdenadas = computed(() => {
                    return [...tiradas.value].sort((a, b) => {
                        return new Date(b.fecha) - new Date(a.fecha);
                    });
                });

                const formatearFecha = (fechaString) => {
                    const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
                    return new Date(fechaString).toLocaleDateString('es-ES', opciones);
                };

                const obtenerClaseBadge = (palo) => {
                    if (!palo) return '';
                    const p = palo.toLowerCase();
                    if (p.includes('mayor')) return 'badge-arcanos';
                    if (p.includes('basto')) return 'badge-bastos';
                    if (p.includes('oro') || p.includes('pentáculo')) return 'badge-oros';
                    if (p.includes('espada')) return 'badge-espadas';
                    if (p.includes('copa')) return 'badge-copas';
                    return '';
                };

                return {
                    tiradasOrdenadas,
                    formatearFecha,
                    obtenerClaseBadge
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
